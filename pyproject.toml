[project]
name = "gnss-sensitivity-test"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "geographiclib>=2.0,<3",
    "jsonschema>=4.23,<5",
    "PySide6-Essentials>=6.8,<6.9",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
